name: Publier Ramy's Space sur GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les fichiers
        uses: actions/checkout@v4

      - name: Préparer uniquement les fichiers de l'application
        run: |
          mkdir -p _site
          cp index.html ramy-space.html editable-app.js manifest.json sw.js anime-avatar.svg icon-192.png icon-512.png apple-touch-icon.png _site/

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparer le site à publier
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publier le site
        id: deployment
        uses: actions/deploy-pages@v4
